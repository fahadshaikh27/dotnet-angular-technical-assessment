<div class="product-list">

  <h2>Product List</h2>

  @if (products.length === 0) {

    <p>No products found.</p>

  } @else {

    <table>

      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Description</th>
          <th>Price</th>
          <th>Quantity</th>
        </tr>
      </thead>

      <tbody>

        @for (product of products; track product.id) {

          <tr>
            <td>{{ product.id }}</td>
            <td>{{ product.name }}</td>
            <td>{{ product.description }}</td>
            <td>₹{{ product.price }}</td>
            <td>{{ product.quantity }}</td>
          </tr>

        }

      </tbody>

    </table>

  }

</div>

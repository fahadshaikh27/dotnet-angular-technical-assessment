<div class="summary">

  <h2>Product Summary</h2>

  <div class="summary-container">

    <div class="summary-card">
      <h3>Total Products</h3>
      <p>{{ totalProducts }}</p>
    </div>

    <div class="summary-card">
      <h3>Total Quantity</h3>
      <p>{{ totalQuantity }}</p>
    </div>

    <div class="summary-card">
      <h3>Total Inventory Value</h3>
      <p>₹{{ totalValue }}</p>
    </div>

  </div>

</div>
